name: Generation portability report

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even a verified cache hit
        type: boolean
        default: false
      candidate_spec:
        description: Private proof JSON (SHA, Node, draft bundle, command, output hashes)
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generation-portability-${{ inputs.candidate_spec && fromJSON(inputs.candidate_spec).sha || github.ref }}
  cancel-in-progress: ${{ !inputs.candidate_spec }}

jobs:
  compare:
    if: ${{ !inputs.candidate_spec }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wildshard/generate
          key: generation-linux-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            generation-linux-${{ runner.arch }}-
      - name: Cold generation on cache miss and retained-byte comparison
        env:
          FORCE_COMPARE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE_COMPARE" = true ]; then args+=(--force); fi
          node scripts/generation-linux.mjs --out=generation-linux.json "${args[@]}"
      - name: Publish portability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-linux-${{ github.sha }}
          path: generation-linux.json
          if-no-files-found: error
          retention-days: 7

  candidate-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_spec != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CANDIDATE_SPEC: ${{ inputs.candidate_spec }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep every prerequisite commit, without downloading historical asset bytes.
          # The checkout and exact candidate import still materialize their own blobs.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify private bundle and remove its draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_OUT: ${{ runner.temp }}/candidate-proof
        run: |
          cp scripts/generation-candidate.py "$RUNNER_TEMP/generation-candidate.py"
          python3 "$RUNNER_TEMP/generation-candidate.py" restore
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJSON(inputs.candidate_spec).node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run exact candidate command and compare every declared byte
        env:
          PROOF_OUT: ${{ runner.temp }}/candidate-proof
        run: python3 "$RUNNER_TEMP/generation-candidate.py" compare
      - name: Publish private candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-proof
          if-no-files-found: error
          retention-days: 7
