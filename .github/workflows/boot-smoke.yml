# Release gate, deliberately outside push CI: macOS queueing must not extend its critical path.
name: boot-smoke
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit to prove (defaults to this workflow's SHA)
        type: string
        required: false
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    # Automatic proofs coalesce while queued; explicit SHA dispatches keep
    # their own group and always build the requested commit.
    concurrency:
      group: boot-smoke-build-${{ github.event_name == 'workflow_run' && 'main' || inputs.sha || github.sha }}
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/progress/
            !/art/
            !/sources/
            !/docs/
          sparse-checkout-cone-mode: false
      - name: Bind the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Mark exact-SHA proof pending
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            -f context=boot-smoke -f state=pending -f description='Real built-dist title and gameplay proof running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the exact commit's real products and dist
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ steps.tested.outputs.sha }}
          # All ten products share one builder process; macOS defaults to a 2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          python3 scripts/heavy-lane.py build -- bash -c 'pnpm gen && node scripts/build-shardfiles.mjs && pnpm exec vite build'
      - name: Pack the exact built dist
        run: tar -cf boot-dist.tar -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: boot-dist
          path: boot-dist.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  boot-smoke:
    needs: build
    # Every browser drives the same exact-SHA bytes; cold generation/build has
    # its own unchanged 20-minute budget, outside each browser leg's budget.
    strategy:
      fail-fast: false
      matrix:
        part: [boot-public, boot-developer, boot-grid, hover-chromium, hover-webkit]
    concurrency:
      group: boot-smoke-${{ matrix.part }}-${{ github.event_name == 'workflow_run' && 'main' || inputs.sha || github.sha }}
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/progress/
            !/art/
            !/sources/
            !/docs/
            !/public/
          sparse-checkout-cone-mode: false
      - name: Bind the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: boot-touch-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: boot-dist
      - name: Unpack and verify the tested dist
        env:
          TESTED_SHA: ${{ needs.build.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          mkdir -p dist
          tar -xf boot-dist.tar -C dist
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { build } = JSON.parse(readFileSync("dist/version.json", "utf8")); const prefix = build.split("-")[0]; if (!/^[a-f0-9]{7,40}$/u.test(prefix) || !process.env.TESTED_SHA.startsWith(prefix)) throw new Error("Built dist does not match tested SHA");'
      - name: Every public shard reaches real page-ready
        if: matrix.part == 'boot-public'
        run: node scripts/parity/boot-smoke.mjs --case-group=public
      - name: Experimental shards reach real page-ready
        if: matrix.part == 'boot-developer'
        run: node scripts/parity/boot-smoke.mjs --case-group=developer
      - name: Grid home and Signal road entry reach real page-ready
        if: matrix.part == 'boot-grid'
        run: node scripts/parity/boot-smoke.mjs --case-group=grid
      - name: Chromium touch HOVER mounts in the template and on the grid road
        if: matrix.part == 'hover-chromium'
        run: node scripts/parity/hover-touch.mjs --out=boot-smoke-results/hover-chromium
      - name: WebKit touch HOVER mounts in the template and on the grid road
        if: matrix.part == 'hover-webkit'
        run: scripts/browser-lane.sh --max 8 node scripts/parity/hover-touch.mjs --engine=webkit --out=boot-smoke-results/hover-webkit
      - name: WebKit world and held-item rendering
        if: matrix.part == 'hover-webkit'
        run: scripts/browser-lane.sh --max 3 node scripts/webkit-render-smoke.mjs --dist=dist
      - name: Record smoke queue and run timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p boot-smoke-results
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '{created_at, run_started_at}' > boot-smoke-results/workflow-timing.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "boot-smoke (${{ matrix.part }})") | {created_at, started_at, completed_at, runner_name, steps}' > boot-smoke-results/job-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-smoke-${{ matrix.part }}
          path: boot-smoke-results/
          retention-days: 7
          if-no-files-found: warn

  verdict:
    # The exact-SHA proof requires all five legs. A replaced leg leaves this SHA unproven:
    # it gets `error` so a pending status never lingers; the newer SHA carries the proof.
    needs: [build, boot-smoke]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    steps:
      - name: Bind the tested commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: Publish exact-SHA proof outcome
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          BUILD: ${{ needs.build.result }}
          LEGS: ${{ needs.boot-smoke.result }}
        run: |
          case "$BUILD:$LEGS" in
            success:success) state=success; description='Real built-dist title and gameplay proof' ;;
            *cancelled*) state=error; description='Cancelled before all smoke legs completed' ;;
            *) state=failure; description='Real built-dist title and gameplay proof' ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            -f context=boot-smoke -f state="$state" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release:
    # Jake, G284 + "Hourly is fine" (2026-10-09): a green exact-SHA boot smoke on main dispatches the release at once, but at
    # most once an hour. It dispatches only when no release run (schedule or dispatch) started in the last 60 min and none
    # is queued or running, and only when production does not already serve the proven SHA (a no-op release would burn the
    # hour). Otherwise it does nothing: the :17 cron, the backstop or an agent's hand dispatch picks the pin up.
    needs: [boot-smoke, verdict]
    if: github.event_name == 'workflow_run' && needs.boot-smoke.result == 'success' && needs.verdict.result == 'success'
    concurrency:
      group: boot-smoke-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # read the release runs and dispatch deploy.yml
      statuses: read # inspect the newest candidate's exact-SHA boot proof
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            /.github/deploy-pin.json
            /scripts/deploy-pin.mjs
            /scripts/deploy-version.mjs
          sparse-checkout-cone-mode: false
      - name: Dispatch the release if the hourly slot is free
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.verdict.outputs.sha }}
        run: |
          mode=$(node -p "require('./.github/deploy-pin.json').mode")
          if [ "$mode" != newest-ci-green ]; then echo "Release mode $mode: keeping the configured pin policy."; exit 0; fi
          export GITHUB_OUTPUT="$RUNNER_TEMP/release.out"
          node scripts/deploy-pin.mjs release-ready
          if ! grep -qx 'ready=true' "$GITHUB_OUTPUT"; then echo 'A newer exact-SHA smoke is pending; leaving the hourly slot free.'; exit 0; fi
          DEPLOY_SHA="$(sed -n 's/^sha=//p' "$GITHUB_OUTPUT")"
          export DEPLOY_SHA
          node scripts/deploy-version.mjs check
          if grep -qx 'skip=true' "$GITHUB_OUTPUT"; then echo "Production already serves $DEPLOY_SHA."; exit 0; fi
          node scripts/deploy-pin.mjs release-slot
          if ! grep -qx 'free=true' "$GITHUB_OUTPUT"; then echo 'The hourly release slot is taken; the next release picks this SHA up.'; exit 0; fi
          gh workflow run deploy.yml --ref main
          echo "### Dispatched the release for \`$DEPLOY_SHA\` (hourly slot free)" >> "$GITHUB_STEP_SUMMARY"
