# Release gate, deliberately outside push CI: macOS queueing must not extend its critical path.
name: boot-smoke
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit to prove (defaults to this workflow's SHA)
        type: string
        required: false
      source_run:
        description: Explicit exact push run (all 16 jobs must pass if its aggregate is stuck)
        type: string
        required: false
      automatic:
        description: Successful push CI dispatch (wait for its exact aggregate)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  statuses: write
# Coalesce queued automatic proofs as complete cohorts. Independent leg locks
# replace different pending legs and strand both exact-SHA workflows.
# Explicit proofs retain a separate group for their requested SHA.
concurrency:
  group: boot-smoke-cohort-${{ inputs.automatic && 'main' || inputs.sha || github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
      source_run: ${{ steps.source.outputs.run }}
    steps:
      - name: Bind the tested commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.sha || github.sha }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: Mark exact-SHA proof pending
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            -f context=boot-smoke -f state=pending -f description='Real built-dist title and gameplay proof running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/checkout@v4
        if: ${{ !inputs.automatic && inputs.source_run != '' }}
        with:
          sparse-checkout: scripts/deploy-pin.mjs
          sparse-checkout-cone-mode: false
      - name: Select the exact successful main push build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          SOURCE_RUN: ${{ inputs.source_run }}
          AUTOMATIC: ${{ inputs.automatic }}
          JOB_PROOF_RUN: ${{ !inputs.automatic && inputs.source_run || '' }}
        run: |
          run_id="$SOURCE_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
              -f event=push -f head_sha="$TESTED_SHA" -f status=success -f per_page=100 \
              --jq ".workflow_runs[] | select(.head_branch == \"main\" and .head_sha == \"$TESTED_SHA\") | .id" | head -1)
          fi
          test -n "$run_id" || { echo '::error::No successful exact-SHA main push build'; exit 1; }
          case "$run_id" in *[!0-9]*) echo '::error::Invalid source run identity'; exit 1 ;; esac
          if [ "$AUTOMATIC" = true ]; then
            # Dispatch returns before the parent aggregate closes. Never
            # download its artifact until that exact run succeeds.
            timeout 300s gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > source-run.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const run = JSON.parse(readFileSync('source-run.json', 'utf8'));
          if (run.event !== 'push' || run.head_branch !== 'main'
            || run.head_sha !== process.env.TESTED_SHA || run.head_repository.full_name !== process.env.GITHUB_REPOSITORY
            || run.path !== '.github/workflows/deploy.yml') throw new Error('Artifact source is not the exact successful main push CI');
          if (run.status !== 'completed' || run.conclusion !== 'success') {
            if (process.env.JOB_PROOF_RUN !== String(run.id)) throw new Error('Artifact source aggregate is not successful');
            const { ciRunGreen } = await import(pathToFileURL(resolve('scripts/deploy-pin.mjs')).href);
            if (!ciRunGreen(process.env.TESTED_SHA, process.env.JOB_PROOF_RUN)) throw new Error('Not every required exact-run CI job succeeded');
            console.log(`CI aggregate exception: exact run ${run.id}, every required job verified successful`);
          }
          NODE
          echo "run=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: boot-dist-manifest
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Verify the exact push manifest
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync('boot-dist-manifest.json', 'utf8'));
          const core = ['boot-public','boot-developer','boot-grid','hover-chromium','hover-webkit','explorer'];
          // An older successful push can dispatch while this dry-run lands.
          // Its original six exact artifacts remain usable; its phone leg
          // reports missing support and cannot count as the G745 trial.
          const parts = Object.hasOwn(proof.legs, 'phone-route') ? [...core, 'phone-route'] : core;
          const prefix = proof.version.build.split('-')[0];
          if (proof.sha !== process.env.TESTED_SHA || proof.run !== process.env.SOURCE_RUN
            || !/^[a-f0-9]{7,40}$/u.test(prefix) || !proof.sha.startsWith(prefix)
            || Object.keys(proof.legs).sort().join() !== [...parts].sort().join()
            || parts.some(part => !/^[a-f0-9]{64}$/u.test(proof.legs[part].archiveHash)
              || !Number.isSafeInteger(proof.legs[part].archiveBytes) || proof.legs[part].archiveBytes <= 0))
            throw new Error('Push manifest does not match tested SHA/run and all seven artifact legs');
          NODE

  boot-smoke:
    needs: build
    # Every browser drives the verified exact-SHA push-CI artifact; no cold
    # generation/build is repeated inside the smoke workflow.
    strategy:
      fail-fast: false
      matrix:
        part: [boot-public, boot-developer, boot-grid, hover-chromium, hover-webkit, explorer, phone-route]
    # G745: exactly the phone route reports without gating for its first ordinary run.
    continue-on-error: ${{ matrix.part == 'phone-route' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/progress/
            !/art/
            !/sources/
            !/docs/
            !/public/
          sparse-checkout-cone-mode: false
      - name: Bind the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: boot-touch-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium webkit
      - name: Start exact-leg transfer clock
        run: date +%s > boot-dist-download-started
      - uses: actions/download-artifact@v4
        with:
          name: boot-dist-manifest
          github-token: ${{ github.token }}
          run-id: ${{ needs.build.outputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: boot-dist-${{ (matrix.part == 'boot-public' || matrix.part == 'boot-developer' || matrix.part == 'phone-route') && matrix.part || 'worlds' }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.build.outputs.source_run }}
          path: boot-dist-parts
      - name: Unpack and verify the tested dist
        env:
          TESTED_SHA: ${{ needs.build.outputs.sha }}
          SOURCE_RUN: ${{ needs.build.outputs.source_run }}
          SMOKE_PART: ${{ matrix.part }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          python3 scripts/boot-dist.py restore --sha "$TESTED_SHA" --run "$SOURCE_RUN" --part "$SMOKE_PART"
          mkdir -p boot-smoke-results
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync('boot-dist-parts/boot-dist-proof.json', 'utf8'));
          const seconds = Date.now()/1000 - Number(readFileSync('boot-dist-download-started', 'utf8'));
          const receipt = { part: process.env.SMOKE_PART, sha: process.env.TESTED_SHA, run: process.env.SOURCE_RUN,
            archiveBytes: proof.archiveBytes, transferAndVerifySeconds: seconds };
          console.log(`boot-dist transfer ${JSON.stringify(receipt)}`);
          writeFileSync('boot-smoke-results/dist-transfer.json', JSON.stringify(receipt));
          NODE
          mkdir -p public/assets/physics
          cp dist/assets/physics/rapier.wasm public/assets/physics/rapier.wasm
      - name: Select the phone Simulator toolchain
        if: matrix.part == 'phone-route'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --find simctl
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.2
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Select the native iPhone runner or record WebKit fallback
        if: matrix.part == 'phone-route'
        id: phone
        run: node scripts/parity/phone-route-runner.mjs --select-engine >> "$GITHUB_OUTPUT"
      - name: Install Simulator Web Inspector transport
        if: matrix.part == 'phone-route' && steps.phone.outputs.engine == 'simulator'
        run: brew install ios-webkit-debug-proxy
      - name: Jake's cold phone route (first ordinary run reports only)
        if: matrix.part == 'phone-route'
        env:
          TESTED_SHA: ${{ needs.build.outputs.sha }}
          PHONE_ROUTE_MODE: report-only
        run: node scripts/parity/phone-route-runner.mjs
      - name: Every public shard reaches real page-ready
        if: matrix.part == 'boot-public'
        run: node scripts/parity/boot-smoke.mjs --case-group=public
      - name: Experimental shards reach real page-ready
        if: matrix.part == 'boot-developer'
        run: node scripts/parity/boot-smoke.mjs --case-group=developer
      - name: Grid home and Signal road entry reach real page-ready
        if: matrix.part == 'boot-grid'
        run: node scripts/parity/boot-smoke.mjs --case-group=grid
      - name: Chromium touch HOVER mounts in the template and on the grid road
        if: matrix.part == 'hover-chromium'
        run: node scripts/parity/hover-touch.mjs --out=boot-smoke-results/hover-chromium
      - name: WebKit touch HOVER mounts in the template and on the grid road
        if: matrix.part == 'hover-webkit'
        run: scripts/browser-lane.sh --max 8 node scripts/parity/hover-touch.mjs --engine=webkit --out=boot-smoke-results/hover-webkit
      - name: WebKit world and held-item rendering
        if: matrix.part == 'hover-webkit'
        run: scripts/browser-lane.sh --max 3 node scripts/webkit-render-smoke.mjs --dist=dist
      - name: Every primary Model Explorer draws its actual catalogue
        if: matrix.part == 'explorer'
        run: node scripts/parity/explorer-smoke.mjs
      - name: Record smoke queue and run timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p boot-smoke-results
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '{created_at, run_started_at}' > boot-smoke-results/workflow-timing.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "boot-smoke (${{ matrix.part }})") | {created_at, started_at, completed_at, runner_name, steps}' > boot-smoke-results/job-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-smoke-${{ matrix.part }}
          path: boot-smoke-results/
          retention-days: 7
          if-no-files-found: warn

  verdict:
    # G745 dry run: six required legs plus one report-only phone route.
    # Remove only its continue-on-error after the first ordinary report.
    # A replaced required leg leaves this SHA unproven:
    # it gets `error` so a pending status never lingers; the newer SHA carries the proof.
    needs: [build, boot-smoke]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    steps:
      - name: Bind the tested commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.sha || github.sha }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: Publish exact-SHA proof outcome
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          BUILD: ${{ needs.build.result }}
          LEGS: ${{ needs.boot-smoke.result }}
        run: |
          case "$BUILD:$LEGS" in
            success:success) state=success; description='Real built-dist title and gameplay proof' ;;
            *cancelled*) state=error; description='Cancelled before all smoke legs completed' ;;
            *) state=failure; description='Real built-dist title and gameplay proof' ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            -f context=boot-smoke -f state="$state" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release:
    # Jake, G284 + "Hourly is fine" (2026-10-09): a green exact-SHA boot smoke on main dispatches the release at once, but at
    # most once an hour. It dispatches only when no release run (schedule or dispatch) started in the last 60 min and none
    # is queued or running, and only when production does not already serve the proven SHA (a no-op release would burn the
    # hour). Otherwise it does nothing: the :17 cron, the backstop or an agent's hand dispatch picks the pin up.
    needs: [boot-smoke, verdict]
    if: inputs.automatic && needs.boot-smoke.result == 'success' && needs.verdict.result == 'success'
    concurrency:
      group: boot-smoke-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # read the release runs and dispatch deploy.yml
      statuses: read # inspect the newest candidate's exact-SHA boot proof
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            /.github/deploy-pin.json
            /scripts/deploy-pin.mjs
            /scripts/deploy-version.mjs
          sparse-checkout-cone-mode: false
      - name: Dispatch the release if the hourly slot is free
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.verdict.outputs.sha }}
        run: |
          mode=$(node -p "require('./.github/deploy-pin.json').mode")
          if [ "$mode" != newest-ci-green ]; then echo "Release mode $mode: keeping the configured pin policy."; exit 0; fi
          export GITHUB_OUTPUT="$RUNNER_TEMP/release.out"
          node scripts/deploy-pin.mjs release-ready
          if ! grep -qx 'ready=true' "$GITHUB_OUTPUT"; then echo 'No candidate has both CI and exact-SHA smoke green; leaving the hourly slot free.'; exit 0; fi
          DEPLOY_SHA="$(sed -n 's/^sha=//p' "$GITHUB_OUTPUT")"
          export DEPLOY_SHA
          node scripts/deploy-version.mjs check
          if grep -qx 'skip=true' "$GITHUB_OUTPUT"; then echo "Production already serves $DEPLOY_SHA."; exit 0; fi
          node scripts/deploy-pin.mjs release-slot
          if ! grep -qx 'free=true' "$GITHUB_OUTPUT"; then echo 'The hourly release slot is taken; the next release picks this SHA up.'; exit 0; fi
          gh workflow run deploy.yml --ref main
          echo "### Dispatched the release for \`$DEPLOY_SHA\` (hourly slot free)" >> "$GITHUB_STEP_SUMMARY"
