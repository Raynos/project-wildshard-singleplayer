# Pushes and pull requests run the gates. Production deploys hourly or on manual dispatch.
# The hourly run checks /version.json first and skips when HEAD is already live.
# GitHub builds the Vercel artifact; Vercel only uploads the prebuilt output.
# Secrets: VERCEL_TOKEN (project-scoped deploy token), VERCEL_BUILD_TOKEN (team-scoped
# token for vercel pull/build), VERCEL_ORG_ID and VERCEL_PROJECT_ID.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even if this commit is already live
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  DEPLOY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Progress captures and art sources are not used by this build.
          filter: blob:none
          sparse-checkout: |
            /*
            !/progress/
            !/art/
            !/sources/
            !/docs/
          sparse-checkout-cone-mode: false

      - name: Check live commit
        id: live
        if: env.DEPLOY == 'true'
        env:
          DEPLOY_FORCE: ${{ inputs.force }}
        run: node scripts/deploy-version.mjs check

      - name: Require deployment credentials
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is missing'; exit 1; }
          test -n "$VERCEL_BUILD_TOKEN" || { echo '::error::VERCEL_BUILD_TOKEN is missing; create a team-scoped token for vercel pull/build'; exit 1; }
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" || { echo '::error::Vercel project IDs are missing'; exit 1; }

      - uses: pnpm/action-setup@v4
        if: steps.live.outputs.skip != 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.live.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.live.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.live.outputs.skip != 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.live.outputs.skip != 'true'
        run: pnpm run lint

      - name: Test
        if: steps.live.outputs.skip != 'true'
        run: pnpm test

      - name: CSS check
        if: steps.live.outputs.skip != 'true'
        run: node scripts/check-css.mjs

      # Push/PR CI still verifies the web bundle; scheduled deploys build it with vercel build below.
      - name: Web build gate
        if: env.DEPLOY != 'true'
        run: pnpm exec vite build

      - name: Native web build
        if: steps.live.outputs.skip != 'true'
        run: pnpm run build:native

      - name: Build Vercel output in GitHub Actions
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel pull --yes --environment production --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
          vercel build --prod --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
          test -f .vercel/output/config.json
          test -f .vercel/output/static/version.json
          test -f .vercel/output/functions/api/inbox.func/.vc-config.json
          test -f .vercel/output/functions/api/errors.func/.vc-config.json

      - name: Deploy prebuilt output
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --scope raynos-projects --token "$VERCEL_TOKEN")
          echo "deployed $url for $GITHUB_SHA"
          echo "### Deployed \`$GITHUB_SHA\` to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        run: |
          node scripts/deploy-version.mjs verify
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'x-review-password: invalid' https://wildshard-singleplayer.vercel.app/api/inbox)
          test "$code" = 401 || { echo "::error::/api/inbox returned HTTP $code, expected 401"; exit 1; }
