# Pushes and pull requests run the gates. Production releases after a successful boot, hourly or on manual dispatch.
# A release resolves .github/deploy-pin.json's policy; newest-ci-green requires push CI and an exact-SHA boot proof.
# It checks /version.json and skips only when that selected commit is already live.
# GitHub builds the Vercel artifact; Vercel only uploads the prebuilt output.
# Secrets: VERCEL_BUILD_TOKEN (team-scoped CLI token for pull/build/deploy),
# VERCEL_ORG_ID and VERCEL_PROJECT_ID.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even if this commit is already live
        type: boolean
        required: false
        default: false

# Releases (the hourly schedule, a manual dispatch) queue apart from push / PR CI: GitHub keeps one PENDING run per group,
# and with many agents pushing, every push's CI run replaced the pending release, so nothing shipped for hours (E339,
# 2026-09-30: two dispatches in a row cancelled). Releases still queue behind each other.
# Push and PR CI runs only check (no deploy), so each commit gets its own group and none is ever replaced (E427, Jake
# 2026-10-03: 104 of 200 runs that day were cancelled because GitHub keeps one pending run per group; the repo is public,
# so the extra parallel runs cost no minutes).
concurrency:
  group: deploy-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || format('ci-{0}', github.sha) }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  statuses: write # read release gates and mark the exact verified production SHA
  actions: read # the newest-ci-green pin reads this workflow's push runs

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  DEPLOY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Progress captures and art sources are not used by this build.
          filter: blob:none
          sparse-checkout: |
            /*
            !/progress/
            !/art/
            !/sources/
            !/docs/
          sparse-checkout-cone-mode: false

      # Resolve the current pin policy, including newest CI + exact-SHA smoke for newest-ci-green.
      # main's reader runs from $RUNNER_TEMP because the selected tree may predate it.
      - name: Read the deploy pin
        id: pin
        if: env.DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/deploy-pin.mjs scripts/deploy-version.mjs "$RUNNER_TEMP/"
          node "$RUNNER_TEMP/deploy-pin.mjs" read

      - name: Gate check (a required pin needs gpu-gate = success)
        if: env.DEPLOY == 'true' && steps.pin.outputs.gate == 'required'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/deploy-pin.mjs" check-gate "${{ steps.pin.outputs.sha }}"

      - name: Check out the pin
        if: env.DEPLOY == 'true'
        run: |
          git fetch --no-tags --filter=blob:none origin "${{ steps.pin.outputs.sha }}"
          git checkout --detach "${{ steps.pin.outputs.sha }}"

      - name: Check live commit
        id: live
        if: env.DEPLOY == 'true'
        env:
          DEPLOY_FORCE: ${{ inputs.force }}
          DEPLOY_SHA: ${{ steps.pin.outputs.sha }}
        run: node "$RUNNER_TEMP/deploy-version.mjs" check

      - name: Require deployment credentials
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          test -n "$VERCEL_BUILD_TOKEN" || { echo '::error::VERCEL_BUILD_TOKEN is missing; a team-scoped token is required for the Vercel CLI'; exit 1; }
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" || { echo '::error::Vercel project IDs are missing'; exit 1; }

      - uses: pnpm/action-setup@v4
        if: steps.live.outputs.skip != 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.live.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.live.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.live.outputs.skip != 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.live.outputs.skip != 'true'
        run: pnpm run lint

      # A release runs the whole `pnpm test` here. Push / PR CI runs its node checks here and the vitest suite once, in
      # the 6 `vitest` shard jobs below, whose coverage the `coverage` job merges and ratchets (E429).
      - name: Test
        if: steps.live.outputs.skip != 'true'
        run: |
          if [ "$DEPLOY" = true ]; then pnpm test; else pnpm run test:checks; fi
          python3 scripts/heavy-lane.py build -- pnpm exec vite build
          node scripts/check-chunks.mjs dist

      - name: CSS check
        if: steps.live.outputs.skip != 'true'
        run: node scripts/check-css.mjs

      - name: Native web build
        if: steps.live.outputs.skip != 'true'
        run: pnpm run build:native

      - name: Build Vercel output in GitHub Actions
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel pull --yes --environment production --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
          vercel build --prod --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
          test -f .vercel/output/config.json
          test -f .vercel/output/static/version.json
          test -f .vercel/output/functions/api/inbox.func/.vc-config.json
          test -f .vercel/output/functions/api/errors.func/.vc-config.json

      - name: Deploy prebuilt output
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
          DEPLOY_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --scope raynos-projects --token "$VERCEL_BUILD_TOKEN")
          echo "deployed $url for $DEPLOY_SHA (the pin)"
          echo "### Deployed \`$DEPLOY_SHA\` (the deploy pin) to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          DEPLOY_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          node "$RUNNER_TEMP/deploy-version.mjs" verify
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'x-review-password: invalid' https://wildshard-singleplayer.vercel.app/api/inbox)
          test "$code" = 401 || { echo "::error::/api/inbox returned HTTP $code, expected 401"; exit 1; }

      - name: Record verified production history
        if: env.DEPLOY == 'true' && steps.live.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -f context=production-live -f state=success -f description='Exact pin verified live in production' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Push / PR CI runs the vitest suite once, split over parallel jobs (E429, Jake 2026-10-03: "Split 3 ways"; E454, Jake
  # 2026-10-07: CI must be fast, so 6 ways: each 3-way shard took ~4.5 min and was the run's critical path). Each
  # shard writes its istanbul coverage; the `coverage` job merges them (scripts/coverage-merge.mjs measures what one
  # unsharded run measures) and runs the coverage ratchet. A red shard, merge or ratchet fails the run, and deploy-pin's
  # newest-ci-green only takes a push run whose every job passed.
  vitest:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/progress/
            !/art/
            !/sources/
            !/docs/
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # links the @wildshard/* workspace packages (E432), so it stays before vitest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Vitest shard ${{ matrix.shard }}/6
        run: |
          pnpm gen
          python3 scripts/heavy-lane.py full-test -- pnpm exec vitest run --shard=${{ matrix.shard }}/6 --coverage --coverage.reporter=json --reporter=dot
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-${{ matrix.shard }}
          path: coverage/coverage-final.json
          retention-days: 1
          if-no-files-found: error

  coverage:
    needs: vitest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the merge and the ratchet are dependency-free node scripts: no install
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/coverage-merge.mjs
            /scripts/coverage-ratchet.mjs
            /test/coverage-ratchet.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-coverage-*
          path: shards
      - name: Merge coverage and ratchet
        run: |
          test "$(ls shards/vitest-coverage-*/coverage-final.json | wc -l)" = 6 # every shard's coverage, or the ratchet reads a partial run
          node scripts/coverage-merge.mjs --out coverage/coverage-summary.json shards/vitest-coverage-*/coverage-final.json
          node scripts/coverage-ratchet.mjs
