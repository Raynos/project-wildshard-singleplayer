# Continuous deployment: every push to main that passes the gates ships to production on Vercel.
# Pull requests run the same gates and nothing else. Deploys go through the Vercel CLI with a token
# held in this repo's Actions secrets, so whoever pushes to main (any collaborator) deploys — Vercel's
# git-author check only applies to its own git integration, which this project deliberately does not use.
# Vercel rebuilds the upload remotely, so a deploy lands ~1–2 min after the ~30 s of gates here.
#
# Secrets: VERCEL_TOKEN (project-scoped token), VERCEL_ORG_ID (team id), VERCEL_PROJECT_ID (project id).
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # re-deploy HEAD by hand: gh workflow run deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # deploy steps run only for pushes to main AND only once the token secret exists; until then the
  # gates still run and the job stays green so the missing token is a notice, not a red build.
  DEPLOY: ${{ github.event_name != 'pull_request' && secrets.VERCEL_TOKEN != '' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo carries ~900 MB of progress captures / art / sources that the build never reads.
          # Partial clone + sparse checkout keeps the runner to the code and the shipped assets.
          filter: blob:none
          sparse-checkout: |
            /*
            !/progress/
            !/art/
            !/sources/
            !/docs/
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ---- gates: a red step here means no deploy -----------------------------------------------
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run --if-present lint

      - name: CSS check
        run: node scripts/check-css.mjs

      - name: Build
        run: pnpm exec vite build

      # ---- deploy (main only) ------------------------------------------------------------------
      - name: No token, no deploy
        if: github.event_name != 'pull_request' && env.DEPLOY != 'true'
        run: echo "::warning::VERCEL_TOKEN secret is not set — gates passed but nothing was deployed"

      # The token is project-scoped (vcp_…): it can deploy this one project and nothing else, which also
      # means `vercel pull` / `vercel build` (they look the user up) refuse it. So: link the directory by
      # writing .vercel/project.json ourselves and let Vercel build the upload remotely (`pnpm run build`).
      - name: Vercel deploy
        if: env.DEPLOY == 'true'
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          url=$(pnpm dlx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployed $url for ${{ github.sha }}"
          echo "### Deployed \`${{ github.sha }}\` to $url" >> "$GITHUB_STEP_SUMMARY"
