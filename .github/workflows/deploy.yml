# J189: CI checks and packages one installed engine artifact.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'progress/**', 'art/**', 'sources/**', 'project/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  statuses: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  build-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-release.mjs install
      - run: pnpm --dir engine-source install --frozen-lockfile
      - name: Load the existing production build environment
        if: github.event_name != 'pull_request'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json",JSON.stringify({projectId:process.env.VERCEL_PROJECT_ID,orgId:process.env.VERCEL_ORG_ID}))'
          vercel pull --yes --environment production --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
      - run: node scripts/check-shell.mjs
      - run: pnpm test
      - run: node scripts/build-release.mjs
      - name: Package the exact artifact with same-origin API functions
        if: github.event_name != 'pull_request'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          node scripts/build-vercel-output.mjs
          node engine-source/scripts/shard-size-gate.mjs .vercel/output/static
          python3 scripts/prebuilt-output.py pack --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-release
          path: |
            dist/
            .vercel/output/
            prebuilt-output/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  prove-pinned:
    needs: build-pinned
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: {name: pinned-release}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Test the exact installed artifact on both phone engines
        run: |
          node scripts/preview-server.mjs --outDir dist --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/prove-release.mjs http://127.0.0.1:4173
      - name: Publish exact-SHA boot verdict
        if: github.event_name != 'pull_request'
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=boot-smoke -f description='Pinned artifact passed Chromium and WebKit phone visits'
  release:
    needs: [build-pinned, prove-pinned]
    if: github.event_name != 'pull_request'
    concurrency: {group: production-release, cancel-in-progress: false}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: {name: pinned-release}
      - name: Honor the production hold
        id: policy
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const pin=JSON.parse(readFileSync('.github/deploy-pin.json','utf8'));
          const allowed=pin.mode==='newest-ci-green'||pin.mode==='pinned'&&pin.sha===process.env.GITHUB_SHA;
          appendFileSync(process.env.GITHUB_OUTPUT,`allowed=${allowed}\n`);
          console.log(allowed?'Exact proven release admitted':'Production held at '+pin.sha);
          NODE
      - name: Stage the proven artifact without moving production
        id: stage
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json",JSON.stringify({projectId:process.env.VERCEL_PROJECT_ID,orgId:process.env.VERCEL_ORG_ID}))'
          node scripts/deploy-source-maps.mjs .vercel/output/static
          url=$(vercel deploy --prebuilt --target=production --skip-domain --yes --scope raynos-projects --token "$VERCEL_BUILD_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged exact artifact: $url"
      - name: Check live ancestry and save epoch on every release path
        if: steps.policy.outputs.allowed == 'true'
        run: node scripts/release-floor.mjs .vercel/output/static/version.json
      - name: Promote the exact tested artifact
        if: steps.policy.outputs.allowed == 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel promote "$STAGED_URL" --yes --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
          DEPLOY_SHA="$GITHUB_SHA" node scripts/deploy-version.mjs verify
