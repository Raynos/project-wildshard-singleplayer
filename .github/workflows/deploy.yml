# J189: CI checks and packages one installed engine artifact.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'progress/**', 'art/**', 'sources/**', 'project/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact shell commit selected by the release train
        required: false
        type: string
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  statuses: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  build-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            /*
            !/art/
            !/progress/
            !/sources/
            !/src/
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Admit the dispatched source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-release.mjs install
      - run: pnpm --dir engine-source install --frozen-lockfile
      # Each reused body is decompressed and SHA-256 checked by the pinned
      # encoder. Admission, builds, size gates and browser proofs still run.
      - name: Cache verified spawn-part encodings
        uses: actions/cache@v4
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br/1
          key: spawn-parts-v1-${{ runner.os }}-node24-${{ hashFiles('engine.pin.json') }}
          restore-keys: spawn-parts-v1-${{ runner.os }}-node24-
      - name: Load the existing production build environment
        if: github.event_name != 'pull_request'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json",JSON.stringify({projectId:process.env.VERCEL_PROJECT_ID,orgId:process.env.VERCEL_ORG_ID}))'
          vercel pull --yes --environment production --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
      - run: pnpm check
      - run: pnpm test
      - run: node scripts/build-release.mjs
      - name: Package the exact artifact with same-origin API functions
        if: github.event_name != 'pull_request'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          node scripts/build-vercel-output.mjs
          node engine-source/scripts/shard-size-gate.mjs .vercel/output/static
          python3 scripts/prebuilt-output.py pack --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: pinned-release
          path: prebuilt-output/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: pinned-release
          path: dist/
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  prove-pr:
    if: github.event_name == 'pull_request'
    needs: build-pinned
    # Match engine's established native WebKit phone-journey host.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/art/
            !/progress/
            !/sources/
            !/src/
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: pinned-release
          path: dist
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Test the exact installed artifact on both phone engines
        run: |
          node scripts/preview-server.mjs --outDir "dist" --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          deadline=$((SECONDS + 60))
          until curl --fail --silent --max-time 2 http://127.0.0.1:4173/version.json >/dev/null; do
            if ! kill -0 "$server_pid" 2>/dev/null || (( SECONDS >= deadline )); then
              echo 'Preview server did not become ready within 60 seconds' >&2
              exit 1
            fi
            sleep 1
          done
          node scripts/prove-release.mjs http://127.0.0.1:4173
  stage-pinned:
    needs: build-pinned
    if: github.event_name != 'pull_request'
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
      url: ${{ steps.stage.outputs.url }}
      build: ${{ steps.stage.outputs.build }}
      archive: ${{ steps.stage.outputs.archive }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            /*
            !/art/
            !/progress/
            !/sources/
            !/src/
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: {name: pinned-release, path: prebuilt-output}
      - run: python3 scripts/prebuilt-output.py restore --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Honor the production hold
        id: policy
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const pin=JSON.parse(readFileSync('.github/deploy-pin.json','utf8'));
          const allowed=pin.mode==='newest-ci-green'||pin.mode==='pinned'&&pin.sha===process.env.GITHUB_SHA;
          appendFileSync(process.env.GITHUB_OUTPUT,`allowed=${allowed}\n`);
          console.log(allowed?'Exact proven release admitted':'Production held at '+pin.sha);
          if(!allowed)appendFileSync(process.env.GITHUB_STEP_SUMMARY,'**HELD:** no Vercel staging, browser release proofs or promotion for this source.\n');
          NODE
      - name: Stage the proven artifact without moving production
        id: stage
        if: steps.policy.outputs.allowed == 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json",JSON.stringify({projectId:process.env.VERCEL_PROJECT_ID,orgId:process.env.VERCEL_ORG_ID}))'
          node scripts/deploy-source-maps.mjs .vercel/output/static
          url=$(vercel deploy --prebuilt --target=production --skip-domain --yes --scope raynos-projects --token "$VERCEL_BUILD_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged exact artifact: $url"
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const version=JSON.parse(readFileSync('.vercel/output/static/version.json','utf8'));
          const proof=JSON.parse(readFileSync('prebuilt-output/proof.json','utf8'));
          if(proof.sha!==process.env.GITHUB_SHA || !/^[a-f0-9]{64}$/.test(proof.archiveHash))throw new Error('Foreign staged archive');
          appendFileSync(process.env.GITHUB_OUTPUT,`build=${version.build}\narchive=${proof.archiveHash}\n`);
          NODE
  prove-pinned:
    needs: [build-pinned, stage-pinned]
    if: github.event_name != 'pull_request' && needs.stage-pinned.outputs.allowed == 'true'
    name: staged-${{ matrix.browser }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [Chromium, WebKit]
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      url: ${{ needs.stage-pinned.outputs.url }}
      build: ${{ needs.stage-pinned.outputs.build }}
      archive: ${{ needs.stage-pinned.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/art/
            !/progress/
            !/sources/
            !/src/
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser == 'Chromium' && 'chromium' || 'webkit' }}
      - name: Prove the exact protected staged URL
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
          STAGED_URL: ${{ needs.stage-pinned.outputs.url }}
          PHONE: ${{ matrix.browser }}
        run: |
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json",JSON.stringify({projectId:process.env.VERCEL_PROJECT_ID,orgId:process.env.VERCEL_ORG_ID}))'
          node scripts/prove-release.mjs "$STAGED_URL" --vercel --existing-bypass "--browser=$PHONE" --profile-worker
      # An earlier strict boot failure must remain red. Still collect the
      # independent real grid path so it cannot hide the road diagnosis.
      - name: Diagnose grid after an earlier refusal
        if: failure() && matrix.browser == 'Chromium'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
          STAGED_URL: ${{ needs.stage-pinned.outputs.url }}
        run: node scripts/prove-release.mjs "$STAGED_URL" --vercel --existing-bypass --browser=Chromium --grid-only --profile-worker
      - name: Retain actual worker CPU diagnosis
        if: always() && matrix.browser == 'Chromium'
        uses: actions/upload-artifact@v4
        with:
          name: release-worker-profile-${{ github.sha }}
          path: tmp/release-worker-profile/
          retention-days: 7
          if-no-files-found: warn
  release:
    needs: [build-pinned, prove-pinned]
    if: github.event_name != 'pull_request'
    concurrency: {group: production-release, cancel-in-progress: false}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            /*
            !/art/
            !/progress/
            !/sources/
            !/src/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Publish the complete exact-source staged verdict
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=boot-smoke -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description='Both complete staged phone proofs passed'
      - name: Promote the same proven artifact
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
          STAGED_URL: ${{ needs.prove-pinned.outputs.url }}
          STAGED_BUILD: ${{ needs.prove-pinned.outputs.build }}
          STAGED_ARCHIVE: ${{ needs.prove-pinned.outputs.archive }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json",JSON.stringify({projectId:process.env.VERCEL_PROJECT_ID,orgId:process.env.VERCEL_ORG_ID}))'
          node scripts/promote-release.mjs "$STAGED_URL" "$STAGED_BUILD" "$STAGED_ARCHIVE"
