name: admin-deploy

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: admin-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare inputs with the live admin revision
        id: inputs
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H 'Cache-Control: no-cache' \
            https://wildshard-admin.vercel.app/version.json > "$RUNNER_TEMP/admin-version.json"
          live="$(python3 - "$RUNNER_TEMP/admin-version.json" <<'PY'
          import json, re, sys
          with open(sys.argv[1]) as source:
              revision = json.load(source)['revision']
          if not isinstance(revision, str) or re.fullmatch('[0-9a-f]{40}', revision) is None:
              raise SystemExit('Live admin has no valid committed revision')
          print(revision)
          PY
          )"
          git fetch --no-tags --depth=1 origin "$live"
          # Compare shipped inputs, not HEAD: unrelated game commits need no admin upload.
          if git diff --quiet "$live" "$GITHUB_SHA" -- \
            admin 'scripts/admin-data*' scripts/admin-data \
            'scripts/memory-report*.mjs' scripts/shard-net-lines.mjs \
            progress/memory progress/loading/sf67 art/playtest \
            docs/plans/SHARD-PLATFORM.md docs/plans/shard-platform/rows.md \
            docs/plans/shard-platform/decisions.md progress/shard-platform/ruler \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json \
            .github/workflows/admin-deploy.yml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Admin inputs match production; skipping build and Vercel upload.'
          else
            result=$?
            test "$result" -eq 1 || exit "$result"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@59.11.2
      - run: pnpm gen
      - run: pnpm exec vitest run admin/test
      - run: pnpm --dir admin typecheck
      - name: Deploy committed admin data
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          test -n "$VERCEL_BUILD_TOKEN" || { echo '::error::Missing VERCEL_BUILD_TOKEN'; exit 1; }
          bash admin/tools/deploy.sh "$GITHUB_SHA"
