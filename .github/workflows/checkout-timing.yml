# Temporary LS9 experiment; manual only, never a release or required gate.
name: LS9 checkout timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout:
    name: Unfiltered checkout (${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Start checkout clock
        run: python3 -c 'import time; print(f"LS9_START_NS={time.monotonic_ns()}")' >> "$GITHUB_ENV"
      # No sparse input here: checkout@v4 otherwise implicitly uses blob:none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore the existing sparse worktree
        run: |
          git sparse-checkout set --no-cone --stdin <<'PATTERNS'
          /*
          !/progress/
          !/art/
          !/sources/
          PATTERNS
      - name: Verify exact checkout and report elapsed time
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          elapsed = (time.monotonic_ns() - int(os.environ['LS9_START_NS'])) / 1e9
          def git(*args):
              return subprocess.check_output(['git', *args])
          head = git('rev-parse', 'HEAD').decode().strip()
          if head != os.environ['GITHUB_SHA']:
              raise RuntimeError('Checkout differs from the exact run SHA')
          if git('rev-list', '--count', 'HEAD').strip() != b'1':
              raise RuntimeError('Checkout is not depth one')
          for key in ['remote.origin.partialclonefilter', 'remote.origin.promisor', 'extensions.partialclone']:
              value = subprocess.run(['git', 'config', '--get', key], capture_output=True, text=True)
              if value.returncode not in [0, 1] or value.stdout.strip():
                  raise RuntimeError(f'Unexpected partial-clone setting: {key}')
          present = skipped = 0
          for entry in git('ls-files', '-t', '-z').split(b'\0'):
              if not entry:
                  continue
              tag, path = entry.decode().split(' ', 1)
              exclude = path.split('/', 1)[0] in {'art', 'progress', 'sources'}
              if (tag == 'S') != exclude or os.path.lexists(path) == exclude:
                  raise RuntimeError(f'Sparse inventory differs: {path}')
              skipped += exclude
              present += not exclude
          subprocess.run(['git', 'diff', '--exit-code', '--no-ext-diff'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--exit-code', '--no-ext-diff'], check=True)
          result = {'sample': int(os.environ['SAMPLE']), 'sha': head,
                    'checkoutSeconds': round(elapsed, 3), 'present': present,
                    'skipped': skipped, 'unfiltered': True, 'clean': True,
                    'indexSha256': hashlib.sha256(git('ls-files', '-s', '-z')).hexdigest()}
          print('LS9_RESULT=' + json.dumps(result, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(f"Unfiltered shallow checkout + unchanged sparse tree: {elapsed:.3f}s\n")
          PY
