name: Authoring clean-room report

on:
  schedule:
    - cron: '47 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authoring-clean-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cold authoring rebuild without runtime, legacy or generated outputs
        run: node scripts/generation-clean-room.mjs --out=generation-clean-room.json
      - name: Publish the report, including blocked jobs and missing product producers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-clean-room-${{ github.sha }}
          path: generation-clean-room.json
          if-no-files-found: error
          retention-days: 7
