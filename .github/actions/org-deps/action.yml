name: org-deps
description: >-
  Let pnpm read private org git dependencies (github:project-wildshard/...).
  This repo sits outside the org, so its GITHUB_TOKEN cannot; mint a read-only
  token from the org app (meta repo P0.2, J34) instead.
inputs:
  client-id:
    description: The org app's client id
    required: true
  private-key:
    description: The org app's private key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      if: inputs.client-id != ''
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: project-wildshard
        permission-contents: read
    # pnpm-lock.yaml records these as git@github.com:..., and git clones them,
    # so every URL form is covered. The rewrite stops at the org: this repo's
    # own partial clones keep fetching with the checkout's credentials.
    - name: Read org repos with the app token
      if: steps.app-token.outputs.token != ''
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        base="https://x-access-token:${TOKEN}@github.com/project-wildshard/"
        git config --global url."$base".insteadOf "https://github.com/project-wildshard/"
        git config --global --add url."$base".insteadOf "git@github.com:project-wildshard/"
        git config --global --add url."$base".insteadOf "ssh://git@github.com/project-wildshard/"
