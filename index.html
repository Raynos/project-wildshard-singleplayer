    <script>
      // iOS Safari: no rubber-band scroll of the fixed page, no pinch zoom — the game owns every gesture.
      document.addEventListener('touchmove', (e) => { if (!e.target.closest('[data-scroll]')) e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      // home-screen PWA vs Safari tab: the page runs under the status bar only in standalone mode (CSS --ws-top handles the offset)
      if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
      // Plain launch: the shard selector is the first screen, with no world or loading panel underneath it.
      const homeParams = new URLSearchParams(location.search);
      if (homeParams.size === 0 || (homeParams.size === 1 && homeParams.has('v'))) document.documentElement.classList.add('title-first');
      // The loader uses a small, already-approved portrait of the selected shard from its first paint.
      // Whitelist the filename: ?chunk is a shard selector, never an arbitrary asset path.
      const loadShard = homeParams.get('chunk') || 'driftwood-isle';
      if (['driftwood-isle', 'pine-hollow', 'nalati-grasslands', 'nine-dragon-stack'].includes(loadShard)) {
        document.documentElement.style.setProperty('--ws-load-portrait', 'url("/assets/title/' + loadShard + '-portrait.jpg")');
      }
      // developer mode (E140, src/engine/core/devMode.ts reads the same key): the loading screen's details, the frame meter, the
      // build id show only under <html data-dev> — set here, before the first paint of the loading panel. No URL switch (E162)
      try { if (JSON.parse(localStorage.getItem('wildshard.save.v2.device') || '{}').keys?.devMode?.data === true) document.documentElement.setAttribute('data-dev', ''); } catch { /* storage blocked: player mode */ }
    </script>

    <script data-loading-first-paint>
      // This clock and the existing fields work before any application module has downloaded.
      // Loading adopts the same DOM and time origin; title arrival is read here, never consumed.
      (() => {
        if (document.documentElement.classList.contains('title-first')) return;
        const root = document.querySelector('.ws-load[data-shell]');
        if (!root) return;
        const started = performance.now();
        root.dataset.startedAt = String(started);
        root.dataset.step = 'admission.modules';
        const field = (key, text) => { const el = root.querySelector('[data-el="' + key + '"]'); if (el && el.textContent !== text) el.textContent = text; };
        const slug = new URLSearchParams(location.search).get('chunk') || 'driftwood-isle';
        let name = slug.replace(/[_-]+/g, ' ').trim() || 'Selected shard';
        let tier = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'phone' : 'desktop';
        try {
          const session = JSON.parse(sessionStorage.getItem('wildshard.save.v2.session') || '{}').keys?.titleArrival?.data;
          const backup = JSON.parse(localStorage.getItem('wildshard.save.v2.device') || '{}').keys?.['titleArrival.once']?.data;
          for (const raw of [session, backup]) {
            const arrival = typeof raw === 'string' ? JSON.parse(raw) : raw;
            if (!arrival || typeof arrival !== 'object') continue;
            if (arrival.slug === slug && typeof arrival.name === 'string' && arrival.name.length <= 256 && Date.now() - arrival.at >= 0 && Date.now() - arrival.at <= 60000) { name = arrival.name; break; }
          }
          const picked = JSON.parse(localStorage.getItem('wildshard.save.v2.global') || '{}').keys?.settings?.data?.tier;
          if (picked === 'phone' || picked === 'desktop') tier = picked;
        } catch { /* denied storage: device tier and destination slug remain available */ }
        field('slug', name);
        field('tier', tier + ' · selecting quality');
        field('line', 'Loading application modules');
        field('suFact', 'Loading application modules');
        let bytes = 0;
        const seen = new Set();
        const resources = () => {
          for (const item of performance.getEntriesByType('resource')) {
            if ((item.initiatorType === 'script' || item.initiatorType === 'link') && !seen.has(item.name + ':' + item.startTime)) { seen.add(item.name + ':' + item.startTime); bytes += item.encodedBodySize || item.transferSize || 0; }
          }
          root.dataset.moduleBytes = String(bytes);
          field('dlFact', bytes > 0 ? (bytes / 1048576).toFixed(2) + ' MB modules read · total pending' : 'Waiting for application modules');
        };
        const tick = () => {
          if (!root.isConnected || !root.hasAttribute('data-shell')) return;
          const seconds = (performance.now() - started) / 1000;
          field('clock', String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + (seconds % 60).toFixed(1).padStart(4, '0'));
          resources();
          requestAnimationFrame(tick);
        };
        tick();
      })();
    </script>
    <!-- app-switch resume screen (E61, src/engine/ui/Resume.ts; test/resume.test.ts keeps the two identical): a GPU-recovery reload
         (?glreload, src/engine/core/GpuRecovery.ts) shows this tiny screen from the first paint, over the last frame's still, and
         never the first-boot loader above -->
    <div class="ws-resume" aria-hidden="true"><div class="ws-resume-shot"></div><div class="ws-resume-hero"></div><div class="ws-resume-word">Project <b>Wildshard</b></div><div class="ws-resume-card"><div class="ws-resume-line">Resuming</div><div class="ws-resume-bar"><i></i></div><div class="ws-resume-level"></div><button type="button" class="ws-resume-btn">Reload</button></div></div>
    <script>
      try {
        if (new URLSearchParams(location.search).has('glreload')) {
          const r = document.querySelector('.ws-resume'), shot = JSON.parse(sessionStorage.getItem('wildshard.save.v2.session') || '{}').keys?.['resume.shot']?.data;
          if (shot) r.firstElementChild.style.backgroundImage = 'url("' + shot + '")';
          // the shard's name + title art (E99), before any bundle runs
          const brand = JSON.parse(sessionStorage.getItem('wildshard.save.v2.session') || '{}').keys?.['resume.brand']?.data || {};
          if (brand.name) r.querySelector('.ws-resume-level').textContent = brand.name;
          if (brand.hero) r.querySelector('.ws-resume-hero').style.backgroundImage = 'url("' + brand.hero + '")';
          r.querySelector('.ws-resume-bar').classList.add('busy');
          r.classList.add('show');
          document.querySelector('.ws-load').style.display = 'none';
        }
      } catch { /* the first-boot loader shows instead */ }
    </script>
