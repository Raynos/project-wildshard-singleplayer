<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Project Wildshard — Chunk Playtest</title>
    <meta name="apple-mobile-web-app-title" content="Wildshard" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070a" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- UI styles: base first (tokens + shared primitives), then one sheet per screen with its own class prefix (scripts/check-css.mjs) -->
    <link rel="stylesheet" href="/src/ui/styles/base.css" />
    <link rel="stylesheet" href="/src/ui/styles/game.css" />
    <link rel="stylesheet" href="/src/ui/styles/menu.css" />
    <link rel="stylesheet" href="/src/ui/styles/pause.css" />
    <link rel="stylesheet" href="/src/ui/styles/touch.css" />
    <link rel="stylesheet" href="/src/ui/styles/update.css" />
    <link rel="stylesheet" href="/src/ui/styles/load.css" />
  </head>
  <body>
    <script>
      // iOS Safari: no rubber-band scroll of the fixed page, no pinch zoom — the game owns every gesture.
      document.addEventListener('touchmove', (e) => { if (!e.target.closest('[data-scroll]')) e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturestart', (e) => e.preventDefault());
    </script>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/boot/sw.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/ui/Update.ts"></script>
  </body>
</html>
