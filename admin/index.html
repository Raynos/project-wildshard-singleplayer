<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WS Admin" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Wildshard Admin</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="top">
        <div class="identity">
        <div class="brand"><span class="mark" aria-hidden="true"></span><span>Wildshard Admin</span></div>
        <div class="build" id="build">loading…</div>
        </div>
        <button id="reload" class="reload" type="button">Reload</button>
      </header>
      <button id="data-update" class="data-update" type="button" hidden>NEW DATA · TAP TO UPDATE</button>
      <main id="view" class="view" tabindex="-1"></main>
      <nav class="tabs" aria-label="Tools">
        <a href="#memory" data-tab="memory"><span class="ti ti-mem" aria-hidden="true"></span>Memory</a>
        <a href="#loading" data-tab="loading"><span class="ti ti-load" aria-hidden="true"></span>Loading</a>
        <a href="#playtests" data-tab="playtests"><span class="ti ti-play" aria-hidden="true"></span>Playtests</a>
        <a href="#plan" data-tab="plan"><span class="ti ti-plan" aria-hidden="true"></span>Plan</a>
        <a href="#waitlist" data-tab="waitlist"><span class="ti ti-wait" aria-hidden="true"></span>Waitlist</a>
      </nav>
    </div>
    <div id="lightbox" class="lightbox" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
